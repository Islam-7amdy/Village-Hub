name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.11.0'

      # Sync dependencies with package.json (avoids frozen-lockfile failures when package.json is updated via npm on Windows).
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: TypeScript type check
        run: npm run lint

      - name: ESLint check
        run: npm run lint:eslint

      - name: Run unit tests
        run: npm test

      - name: Build client & server bundle
        run: npm run build
