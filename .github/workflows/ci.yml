name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The lockfile in this repo is bun.lock (there is no package-lock.json), so install with Bun.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript type check
        run: npm run lint

      - name: ESLint check
        run: npm run lint:eslint

      - name: Run unit tests
        run: npm test

      - name: Build client & server bundle
        run: npm run build
